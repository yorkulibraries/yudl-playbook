---
- name: "Install FITS web service {{ansible_os_family}}"
  get_url:
    url: https://github.com/fitstool/FITSservlet/releases/download/{{ fits_ws_version }}/fits-service-{{ fits_ws_version }}.war
    dest: "{{ tomcat_home }}/webapps/fits.war"
    owner: "{{ fits_user }}"
    group: "{{ fits_group }}"
    checksum: "{{  fits_ws_md5sum  }}"
    force: false
  retries: 5
  register: result
  until: result is succeeded
  changed_when: result.changed
