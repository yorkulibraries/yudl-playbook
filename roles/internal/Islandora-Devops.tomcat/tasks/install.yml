---

- name: Gather service facts
  service_facts:

- name: Install tomcat9
  apt:
    name: "{{ item }}"
    state: present
    cache_valid_time: 3600
  with_items: "{{ tomcat_packages }}"

- name: Install tomcat9 admin
  apt:
    name: "{{ item }}"
    state: present
    cache_valid_time: 3600
  with_items: "{{ tomcat_admin_packages }}"
  when: tomcat_admin_install

- name: Create paths required by the Tomcat systemd sandbox
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tomcat_server_user }}"
    group: "{{ tomcat_server_group }}"
    mode: "0755"
  loop:
    - "{{ fcrepo_home_dir }}"
    - "{{ fcrepo_syn_folder }}"

- name: Start tomcat9
  service:
    name: tomcat9
    state: started
  when: >
    'tomcat9.service' in ansible_facts.services and
    not ansible_facts.services['tomcat9.service'].state == 'running'
