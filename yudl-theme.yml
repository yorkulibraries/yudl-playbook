---

- name: Setup, configure, and install YUDL Drupal Theme
  hosts: webserver
  become: true

  # add some vars here so we can run with --start-at-task if desired
  vars:
    webserver_app_user: "www-data"
    vagrant_user: "vagrant"
    drush_path: "/var/www/html/drupal/vendor/bin/drush"
    yudl_theme_logo_path: "themes/custom/yudl_drupal_theme/images/YorkULogo_DIGITAL_Hor_RGB-136x30.png"
    yudl_theme_favicon_path: "themes/custom/yudl_drupal_theme/images/favicon.ico"

  tasks:

    - name: Ensure york_drupal_theme directory exists
      file:
        path: "{{ drupal_core_path }}/themes/custom/yudl_drupal_theme"
        state: directory
        owner: "{{ webserver_app_user }}"
        group: "{{ webserver_app_user }}"
        mode: "0775"

    - name: Get york_drupal_theme
      become_user: "{{ webserver_app_user }}"
      git:
        repo: https://github.com/yorkulibraries/york_drupal_theme.git
        dest: "{{ drupal_core_path }}/themes/custom/yudl_drupal_theme"
        version: main
        update: true
      register: york_theme_repo

    - name: Chown york_drupal_theme
      file:
        dest: "{{ drupal_core_path }}/themes/custom/yudl_drupal_theme"
        state: directory
        owner: "{{ webserver_app_user }}"
        group: "{{ webserver_app_user }}"
        recurse: true

    - name: Gather enabled themes
      command: "{{ drush_path }} --root={{ drupal_core_path }} pml --status=enabled --type=theme --format=json"
      register: enabled_themes
      changed_when: false

    - name: Enable york_drupal_theme
      command: "{{ drush_path }} --root={{ drupal_core_path }} -y theme:enable york_drupal_theme"
      when: "'york_drupal_theme' not in (enabled_themes.stdout | from_json)"
      register: york_theme_enabled

    - name: Read current default theme
      command: "{{ drush_path }} --root={{ drupal_core_path }} cget system.theme default --format=string"
      register: current_default_theme
      changed_when: false
      failed_when: false

    - name: Set york_drupal_theme default
      command: "{{ drush_path }} --root={{ drupal_core_path }} -y cset system.theme default york_drupal_theme"
      when: >
        current_default_theme.rc != 0 or
        (current_default_theme.stdout | trim) != 'york_drupal_theme'
      register: york_theme_defaulted

    - name: Read york_drupal_theme logo path
      command: "{{ drush_path }} --root={{ drupal_core_path }} cget york_drupal_theme.settings logo.path --format=string"
      register: york_theme_logo_path
      changed_when: false
      failed_when: false

    - name: Set york_drupal_theme logo path
      command: "{{ drush_path }} --root={{ drupal_core_path }} -y cset york_drupal_theme.settings logo.path {{ yudl_theme_logo_path }}"
      when: (york_theme_logo_path.stdout | trim) != yudl_theme_logo_path
      register: york_theme_logo_path_set

    - name: Read york_drupal_theme favicon path
      command: "{{ drush_path }} --root={{ drupal_core_path }} cget york_drupal_theme.settings favicon.path --format=string"
      register: york_theme_favicon_path
      changed_when: false
      failed_when: false

    - name: Set york_drupal_theme favicon path
      command: "{{ drush_path }} --root={{ drupal_core_path }} -y cset york_drupal_theme.settings favicon.path {{ yudl_theme_favicon_path }}"
      when: (york_theme_favicon_path.stdout | trim) != yudl_theme_favicon_path
      register: york_theme_favicon_path_set

    - name: Clear cache when theme state changes
      command: "{{ drush_path }} --root={{ drupal_core_path }} -y cr"
      when: >
        (york_theme_repo.changed | default(false)) or
        (york_theme_enabled.changed | default(false)) or
        (york_theme_defaulted.changed | default(false)) or
        (york_theme_logo_path_set.changed | default(false)) or
        (york_theme_favicon_path_set.changed | default(false))
