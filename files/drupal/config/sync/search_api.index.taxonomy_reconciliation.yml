    type: text
    dependencies:
      module:
        - taxonomy
  name:
    label: Name
    datasource_id: 'entity:taxonomy_term'
    property_path: name
    type: 'solr_text_custom_omit_norms:ngram'
    dependencies:
      module:
        - taxonomy
  status:
    label: Published
    datasource_id: 'entity:taxonomy_term'
    property_path: status
    type: boolean
    dependencies:
      module:
        - taxonomy
  tid:
    label: 'Term ID'
    datasource_id: 'entity:taxonomy_term'
    property_path: tid
    type: integer
    dependencies:
      module:
        - taxonomy
  vid:
    label: Vocabulary
    datasource_id: 'entity:taxonomy_term'
    property_path: vid
    type: string
    dependencies:
      module:
        - taxonomy
datasource_settings:
  'entity:taxonomy_term':
    bundles:
      default: false
      selected:
        - city
        - city_section
        - continent
        - corporate_body
        - country
        - county
        - family
        - genre
        - geo_location
        - language
        - person
        - physical_form
        - province
        - region
        - resource_types
        - rights
        - subject
        - tags
        - temporal_subjects
    languages:
      default: false
