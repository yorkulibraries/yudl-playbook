---

# Change selinux status to permissive
disable_selinux: yes

islandora_extra_ubuntu_packages:
  - wget
  - curl
  - htop
  - tree
  - zsh
  - fish
  - unzip
  - build-essential
  - vim
  - python3-mysqldb
  - multitail
  - silversearcher-ag
  - acl
  - libopenjp2-tools
  - libopenjp2-7
  - libopenjp2-7-dev
  - libtiff-dev
  - libpng-dev
  - libwebp-dev
  - librsvg2-dev
  - libjpeg-dev
  - libjpeg-turbo8-dev
  - libjpeg8-dev
  - libtiff5-dev
  - libtiffxx5
  - libexif-dev
  - zlib1g-dev
  - ffmpeg
  - graphicsmagick
  - libturbojpeg-dev
  # ImageMagick delegates, matching production's build (magick -version)
  - libfontconfig1-dev
  - libfreetype-dev
  - libgs-dev
  - libjbig-dev
  - liblcms2-dev
  - liblzma-dev
  - libx11-dev
  - libxext-dev
  - libxml2-dev

islandora_jwt_expiry: "+7 days"

mysql_users:
  - name: "{{ drupal_db_user }}"
    host: "%"
    password: "{{ drupal_db_password }}"
    priv: "{{ drupal_db_name }}.*:ALL"

php_packages_state: "latest"

# ImageMagick 7, matching production. Leave imagemagick_prebuilt_url empty to build from
# source (always done on non-x86_64 hosts).
imagemagick_version: "7.1.1-2"
imagemagick_prebuilt_url: "https://alpha.library.yorku.ca/imagemagick/imagemagick-7.1.1-2-jammy-amd64.tar.gz"
